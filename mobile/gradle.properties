# ============================================================================================
# Porten 移动端 · Gradle 全局属性
# ============================================================================================

# ------------------------------ JVM / Gradle 运行参数 ------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# Flutter Android tooling 与 tree shaking 尚不完全兼容 Gradle 配置缓存，显式关闭以保证混合构建稳定
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true

# ------------------------------ Kotlin ------------------------------
# official = Kotlin 官方代码风格（4 空格缩进，与本文档约定的 Kotlin 规范一致）
kotlin.code.style=official
# Kotlin 增量编译 / 守护 JVM 参数由 AGP 管理，此处不重复设置

# ------------------------------ Android ------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 完整模式：最大程度压缩 + 混淆 + 优化（发布包必需，AGP 8.13 支持）
android.enableR8.fullMode=true
# 资源命名必须带前缀，避免多模块资源冲突（大厂多模块标准约束）
android.uniquePackageNames=true

# ------------------------------ Porten 自有开关 ------------------------------
# Flutter 集成形态：module（开发期源码依赖）| aar（发布期产物依赖）
porten.flutter.mode=module

# Mock 引擎：true = 全部数据在端内由 Mock 引擎生成；false = 直连真实后端
porten.mock.enabled=true

# 安全加固总开关：控制运行时反调试、证书绑定、完整性校验是否在 App 启动时启用
porten.security.enabled=true

# 日志：release 默认关闭原生日志输出（Kotlin logcat）
porten.logging.enabled=true

# ------------------------------ 构建网络健壮性 ------------------------------
# 沙盒到 dl.google.com / maven.google.com 的链路抖动大：拉长超时并强制重试，
# 避免依赖解析在弱网下无限挂起
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500
