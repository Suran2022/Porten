# Porten CD：main 推送自动构建镜像推送 GHCR，可选 SSH 自动部署到自有服务器
#
# 启用 SSH 自动部署需在仓库 Settings → Secrets and variables → Actions 配置：
#   DEPLOY_HOST    服务器 IP 或域名
#   DEPLOY_USER    SSH 用户（需有 docker 权限）
#   DEPLOY_SSH_KEY SSH 私钥（PEM 全文）
#   DEPLOY_PATH    服务器上项目目录（含 docker-compose.yml 与 backend/.env）
# 未配置上述 Secrets 时：仅构建镜像并推送到 GHCR，不触发服务器部署。
name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Docker/OCI 镜像仓库名强制全小写，而 GitHub 用户名可能含大写
      # （如 Suran2022），必须小写化后再拼 GHCR tag
      - name: 规范化镜像名（小写化所有者）
        id: meta
        run: echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/porten-backend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/porten-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/porten-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lower }}/porten-frontend:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_API_WS_URL=/ws
            VITE_USE_MOCK=false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: SSH 部署到服务器（可选）
    runs-on: ubuntu-latest
    needs: build-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: 拉取新镜像并重启服务
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
